name: Deploy public web edition to GitHub Pages

on:
  push:
    branches: [main, release/public-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_PUBLIC_EDITION: "1"
      EXPO_PUBLIC_API_BASE_URL: https://dilhafizasi-qk78txho.manus.space
      EXPO_PUBLIC_WEB_BASE_URL: /dil-hafizasi-public-ma
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: pnpm test && pnpm check && pnpm lint

      - name: Prepare NativeWind cache
        run: node scripts/prepare-web-export-MA.mjs

      - name: Export public web edition
        run: pnpm exec expo export --platform web --output-dir dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
